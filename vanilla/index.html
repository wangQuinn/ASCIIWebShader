<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
		/>
		<title> ASCII </title>
		<link rel="stylesheet" href="./style.css" />
	</head>

	<body>
		<div id="canvases">
			<canvas id="preview-camera"></canvas>
			<canvas id="ascii-canvas"></canvas>
		</div>
		<canvas id="hidden-canvas"></canvas>

		<div id="container">
			<h1>| ascii webcam |</h1>

			<p id="status">Waiting for camera…</p>

			<h4>grid</h4>

			<p>columns <span data-show id="val-cols">150</span></p>
			<input type="range" id="cols" min="30" max="200" value="150" />

			<h4>image</h4>

			<p>contrast <span data-show id="val-contrast">1.8</span></p>
			<input
				type="range"
				id="contrast"
				min="0.5"
				max="4"
				step="0.1"
				value="1"
			/>

			<p>gamma <span data-show id="val-gamma">1.2</span></p>
			<input
				type="range"
				id="gamma"
				min="0.5"
				max="3"
				step="0.1"
				value="1"
			/>

			<h4>rendering</h4>

			<p>charset</p>
			<select id="charset">
				<option value="default">default dense</option>
				<option value="blocks">blocks</option>
				<option value="minimal">minimal</option>
				<option value="symbols">symbols</option>
			</select>

			<div class="check-row">
				<input type="checkbox" id="color-mode" checked />
				<label for="color-mode">color mode</label>
			</div>
			<div class="check-row">
				<input type="checkbox" id="mirror" checked />
				<label for="mirror">mirror</label>
			</div>
			<div class="check-row">
				<input type="checkbox" id="invert" />
				<label for="invert">invert</label>
			</div>
		</div>

		<div id="toggler" data-click="toggleMenu">
			<svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
				<path
					d="M9 6l6 6-6 6"
					stroke="currentColor"
					stroke-width="2"
					stroke-linecap="round"
					stroke-linejoin="round"
				/>
			</svg>
		</div>

		<script src="src/main.js" defer></script>
	</body>
</html>
